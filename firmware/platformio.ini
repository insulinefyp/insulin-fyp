; ESP32-S3 N16R8 (16 MB flash, 8 MB PSRAM).
; Board definition and USB flags carried over from the working POC.

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_type = debug

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Both sensor drivers are included: these breakout boards ship with either a
; BME280 or a BMP280 and the silkscreen does not say which. The firmware
; detects the chip at boot. The OLED shares the same I2C bus.
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.1.0
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.9
